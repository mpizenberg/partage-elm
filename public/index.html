<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="robots" content="noindex" />
        <title>Partage</title>
        <style>
            html {
                background: #fff8f0;
            }
        </style>
        <script>
            var languages = navigator.languages || [navigator.language || "en"];
            var language = languages.find(function (candidate) {
                return /^(en|fr)(-|$)/i.test(candidate);
            });
            location.replace(/^fr(-|$)/i.test(language || "") ? "/fr/" : "/en/");
        </script>
    </head>
    <body>
        <main>
            <p>Choose a language · Choisir une langue</p>
            <p><a href="/en/">English</a> · <a href="/fr/">Français</a></p>
        </main>
    </body>
</html>
